name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DocuAsk.slnx
      - name: Build
        run: dotnet build DocuAsk.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test DocuAsk.slnx --no-build --configuration Release --verbosity normal
